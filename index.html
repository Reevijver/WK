<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#12261d">
<title>WK Manillen</title>
<style>
:root{--bg:#f5f2e9;--card:#fffdf8;--ink:#18231d;--muted:#68736d;--green:#163d2b;--green2:#24563e;--gold:#c9a95e;--line:#e5e0d4;--win:#dff3e6;--loss:#f7e1df;--draw:#ece9e1;--soft:#f0ede5;--shadow:0 8px 24px rgba(23,42,31,.08)}
*{box-sizing:border-box}
html{scroll-behavior:smooth;overflow-y:scroll;scrollbar-gutter:stable}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}
button,input,select{font:inherit}
button{touch-action:manipulation}
.top{background:linear-gradient(145deg,var(--green),#0d2a1d);color:#fff;padding:calc(18px + env(safe-area-inset-top)) 18px 25px;border-radius:0 0 28px 28px}
.eyebrow{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:#d8c692;font-weight:750}
.top h1{font-size:29px;line-height:1.05;margin:8px 0}
.top p{margin:0;color:#d7e2dc;font-size:14px;line-height:1.45}
.wrap{max-width:760px;margin:auto;padding:16px 14px calc(30px + env(safe-area-inset-bottom))}
.selectCard{margin-top:-31px;background:var(--card);border-radius:18px;padding:14px;box-shadow:var(--shadow);position:relative;z-index:40}
.label{font-size:12px;font-weight:780;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0 0 7px}
.combo{position:relative}
.comboControl{display:flex;align-items:center;border:1px solid var(--line);background:#fff;border-radius:13px;overflow:hidden;min-height:50px}
.comboControl:focus-within{border-color:#769680;box-shadow:0 0 0 3px rgba(36,86,62,.12)}
.comboControl input{min-width:0;flex:1;border:0;background:transparent;padding:13px 10px 13px 14px;font-size:16px;color:var(--ink);outline:none}
.comboToggle,.comboClear{width:44px;align-self:stretch;border:0;background:transparent;color:var(--green);font-size:20px;display:grid;place-items:center}
.comboClear{display:none;font-size:19px;color:var(--muted)}
.combo.hasValue .comboClear{display:grid}
.comboMenu{display:none;position:absolute;left:0;right:0;top:calc(100% + 7px);z-index:90;background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 14px 34px rgba(23,42,31,.18);max-height:min(360px,52vh);overflow:auto;-webkit-overflow-scrolling:touch}
.comboMenu.open{display:block}
.comboOption{width:100%;border:0;border-bottom:1px solid var(--line);background:#fff;padding:11px 13px;text-align:left;display:flex;align-items:center;justify-content:space-between;gap:12px;color:var(--ink)}
.comboOption:last-child{border-bottom:0}
.comboOption.active,.comboOption:active{background:#edf3ef}
.comboOption .optionName{font-weight:760;font-size:15px;line-height:1.25;min-width:0;overflow-wrap:anywhere}
.comboOption .optionMeta{font-size:11px;color:var(--muted);text-align:right;white-space:nowrap}
.comboEmpty{padding:18px;text-align:center;color:var(--muted);font-size:13px}
.selectionMeta{margin:7px 2px 0;color:var(--muted);font-size:11px;min-height:14px}
.profileHero{background:linear-gradient(145deg,var(--green),#0d2a1d);color:#fff;border-radius:18px;padding:16px;margin:14px 0 10px;box-shadow:var(--shadow)}
.profileTop{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:14px;align-items:start}
.profileHero .profileKicker{font-size:10px;font-weight:820;text-transform:uppercase;letter-spacing:.09em;color:#d8c692}
.profileHero h2{font-size:24px;line-height:1.12;margin:5px 0 6px;overflow-wrap:anywhere}
.profileNameRow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:5px 0 6px}
.profileNameRow h2{margin:0}
.profileHonorBadge{display:inline-flex;align-items:center;border:1px solid rgba(216,198,146,.55);background:rgba(201,169,94,.16);color:#f5e5b2;border-radius:999px;padding:4px 8px;font-size:9px;font-weight:850;letter-spacing:.025em;white-space:nowrap}
.honorGrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-bottom:14px}
.honorCard{background:var(--card);border:1px solid #dfd2ac;border-radius:14px;padding:10px 11px;min-width:0}
.honorCard strong{display:block;color:#7b6223;font-size:13px;line-height:1.2;margin-bottom:3px}
.honorCard small{display:block;color:var(--muted);font-size:10.5px;line-height:1.35}
@media(max-width:420px){.honorGrid{grid-template-columns:1fr}}
.profileHero p{margin:0;color:#d7e2dc;font-size:12px;line-height:1.45}
.profileRank{min-width:76px;background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.13);border-radius:13px;padding:10px;text-align:center}
.profileRank span{display:block;font-size:8.5px;text-transform:uppercase;letter-spacing:.05em;color:#d7e2dc}
.profileRank strong{display:block;font-size:25px;margin-top:3px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:0 0 12px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:11px 7px;text-align:center;min-width:0}
.stat b{display:block;font-size:20px;color:var(--green);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat span{display:block;margin-top:2px;font-size:9.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.045em}
.tabs{display:flex;gap:7px;overflow:auto;padding:8px 0 10px;scrollbar-width:none;position:sticky;top:0;z-index:30;background:linear-gradient(var(--bg) 75%,rgba(245,242,233,0))}
.tabs::-webkit-scrollbar{display:none}
.tab{border:1px solid var(--line);background:var(--card);padding:9px 13px;border-radius:999px;white-space:nowrap;font-size:13px;font-weight:740;color:var(--muted);min-height:39px}
.tab.active{background:var(--green);color:#fff;border-color:var(--green)}
.sectionTitle{display:flex;align-items:end;justify-content:space-between;gap:12px;margin:8px 2px 10px}
.sectionTitle h2{font-size:18px;margin:0}
.sectionTitle span{font-size:12px;color:var(--muted);text-align:right}
.overviewGrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-bottom:14px}
.overviewCard{appearance:none;width:100%;border:1px solid var(--line);background:var(--card);border-radius:15px;padding:12px;text-align:left;color:var(--ink);min-height:93px;box-shadow:0 2px 10px rgba(23,42,31,.035)}
.overviewCard.clickable{cursor:pointer}
.overviewCard:active{transform:scale(.995)}
.overviewCard .kicker,.feature .kicker{font-size:10px;font-weight:820;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.overviewCard strong,.feature strong{display:block;margin:5px 0 3px;color:var(--green);font-size:17px;line-height:1.18;overflow-wrap:anywhere}
.overviewCard small,.feature small{display:block;color:var(--muted);font-size:11px;line-height:1.38}
.list{display:grid;gap:9px}
.row{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:12px 13px;box-shadow:0 2px 10px rgba(23,42,31,.035)}
.rowButton{appearance:none;width:100%;text-align:left;color:var(--ink);font:inherit}
.rowButton:active{transform:scale(.995);background:#faf8f2}
.rowTop{display:flex;justify-content:space-between;gap:10px;align-items:center}
.name{font-weight:760;font-size:15px;line-height:1.25;overflow-wrap:anywhere}
.pill{font-size:11px;border-radius:999px;padding:5px 8px;background:#eef1ed;color:var(--green);white-space:nowrap;font-variant-numeric:tabular-nums}
.meta{font-size:12px;color:var(--muted);margin-top:5px;line-height:1.45}
.bar{height:6px;background:#eee9df;border-radius:8px;margin-top:9px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--green2);border-radius:8px}
.year{font-size:12px;color:#9a7c35;font-weight:820}
.match{display:grid;grid-template-columns:45px minmax(0,1fr) auto;gap:9px;align-items:center}
.score{font-weight:820;font-variant-numeric:tabular-nums;white-space:nowrap}
.win{background:var(--win)}
.loss{background:var(--loss)}
.draw{background:var(--draw)}
.resultBadge{display:inline-block;font-size:9px;font-weight:850;border-radius:999px;padding:3px 6px;margin-left:5px;vertical-align:1px;background:rgba(255,255,255,.68)}
.empty{text-align:center;color:var(--muted);padding:34px 18px;background:var(--card);border-radius:16px;border:1px dashed var(--line);line-height:1.5}
.search{margin-bottom:10px}
.search input,.search select,.inlineCombo input,.filterControl{width:100%;border:1px solid var(--line);background:#fff;border-radius:13px;padding:12px 13px;font-size:16px;color:var(--ink);outline:none}
.search input:focus,.search select:focus,.inlineCombo input:focus,.filterControl:focus{border-color:#769680;box-shadow:0 0 0 3px rgba(36,86,62,.12)}
.filterGrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-bottom:10px}
.filterGrid.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.featureGrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-bottom:12px}
.featureGrid.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.feature{appearance:none;border:1px solid var(--line);border-radius:15px;background:var(--card);padding:12px;text-align:left;color:var(--ink);min-width:0}
.feature:active{transform:scale(.995)}
.inlineCombo{position:relative;margin-bottom:12px;z-index:15}
.inlineCombo .comboMenu{top:calc(100% + 6px)}
.h2hHero,.rankHero{background:linear-gradient(145deg,var(--green),#0d2a1d);color:#fff;border-radius:18px;padding:16px;margin-bottom:10px;box-shadow:var(--shadow)}
.h2hHero .versus{font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:#d8c692;font-weight:800}
.h2hHero h3{font-size:20px;margin:6px 0 12px;line-height:1.2;overflow-wrap:anywhere}
.heroStats{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
.heroStat{background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.12);border-radius:11px;padding:8px 5px;text-align:center;min-width:0}
.heroStat b{display:block;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.heroStat span{font-size:8.5px;text-transform:uppercase;letter-spacing:.04em;color:#d7e2dc}
.h2hSplit{display:flex;height:9px;border-radius:999px;overflow:hidden;background:rgba(255,255,255,.16);margin-top:12px}
.h2hSplit .mine{background:#d8c692}
.h2hSplit .theirs{background:#829f8d}
.h2hCaption{display:flex;justify-content:space-between;gap:10px;margin-top:5px;font-size:10px;color:#d7e2dc}
.rankHero{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px}
.rankHero .rankBlock{background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.12);border-radius:13px;padding:10px;min-width:0}
.rankHero span{font-size:9px;text-transform:uppercase;letter-spacing:.05em;color:#d7e2dc}
.rankHero strong{display:block;font-size:22px;color:#fff;margin:5px 0 2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rankHero small{font-size:10px;color:#d7e2dc;line-height:1.35}
.placements{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px;margin:0 0 14px}
.placement{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:9px 5px;text-align:center}
.placement b{display:block;color:var(--green);font-size:16px}
.placement span{display:block;font-size:10px;color:var(--muted);margin-top:2px}
.placement.gold{background:#f7edca;border-color:#dfc56f}.placement.silver{background:#eff1f2;border-color:#c7cdd0}.placement.bronze{background:#f2e1d2;border-color:#d6aa85}
.rankRow{display:grid;grid-template-columns:38px minmax(0,1fr) auto;gap:9px;align-items:center}
.rankNo{font-weight:850;color:#9a7c35;text-align:center;font-variant-numeric:tabular-nums}
.row.selected{outline:2px solid rgba(36,86,62,.35);background:#f3f7f4}
.infoNote{background:var(--soft);border-radius:13px;padding:11px 12px;color:var(--muted);font-size:11px;line-height:1.5;margin:10px 0}
.editionRow{display:grid;grid-template-columns:52px 58px minmax(0,1fr) auto;gap:9px;align-items:center}
.editionYear{font-size:12px;font-weight:820;color:#9a7c35}
.editionPlace{font-weight:850;text-align:center;border-radius:10px;background:#eef1ed;padding:7px 4px;color:var(--green)}
.editionPlace.gold{background:#f7edca;color:#725a13}.editionPlace.silver{background:#eff1f2;color:#566067}.editionPlace.bronze{background:#f2e1d2;color:#7c4d2e}
.miniScore{font-size:11px;font-weight:800;color:var(--green);white-space:nowrap}
.editionHistory{display:grid;gap:8px;margin:0 0 14px}
.editionStandingRow{padding:9px 10px}
.editionStanding{display:grid;grid-template-columns:54px minmax(0,1fr) auto;gap:10px;align-items:center}
.editionStanding .editionPlace{min-width:50px}
.editionMatch{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center}
.editionTeams{display:grid;gap:7px;min-width:0}
.editionTeam{font-size:14px;line-height:1.25;overflow-wrap:anywhere}
.editionTeam.winner{font-weight:800;color:var(--green)}
.editionScores{display:grid;gap:7px;text-align:right;font-weight:850;font-variant-numeric:tabular-nums;font-size:16px}
.editionScores .winner{color:var(--green)}
.editionToolbar{display:grid;grid-template-columns:minmax(0,1fr);gap:8px;margin-bottom:12px}
.editionToolbar select{width:100%;border:1px solid var(--line);background:#fff;border-radius:13px;padding:12px 13px;font-size:16px;color:var(--ink);outline:none}
.editionToolbar select:focus{border-color:#769680;box-shadow:0 0 0 3px rgba(36,86,62,.12)}
.editionHero{grid-template-columns:minmax(0,2fr) minmax(110px,1fr)}
.editionHero .rankBlock:first-child strong{white-space:normal;overflow:visible;text-overflow:clip;font-size:19px;line-height:1.18}
.foot{text-align:center;color:var(--muted);font-size:11px;margin-top:18px;line-height:1.5}
.hidden{display:none!important}
@media(max-width:620px){.rankHero{grid-template-columns:repeat(2,minmax(0,1fr))}.featureGrid.three{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:520px){.editionStandingRow{padding:7px 8px}.medal{font-size:16px}.stats{grid-template-columns:repeat(2,1fr)}.placements{grid-template-columns:repeat(3,1fr)}.top h1{font-size:27px}.tabs{margin-left:-2px;margin-right:-2px}.filterGrid.three{grid-template-columns:1fr 1fr}.filterGrid.three .wideMobile{grid-column:1/-1}.editionRow{grid-template-columns:47px 52px minmax(0,1fr)}.editionStanding{grid-template-columns:44px minmax(0,1fr) auto;gap:7px}.editionStanding .editionPlace{min-width:44px;padding:6px 3px}.editionStanding .name{font-size:13px}.editionStanding .meta{font-size:10.5px;line-height:1.3;margin-top:3px}.editionStanding>.pill{grid-column:auto;justify-self:end;padding:4px 7px;font-size:10px}.editionMatch{gap:8px}}
@media(max-width:370px){.overviewGrid,.featureGrid,.featureGrid.three{grid-template-columns:1fr}.heroStats{grid-template-columns:repeat(2,1fr)}.placements{grid-template-columns:repeat(2,1fr)}.profileTop{grid-template-columns:1fr}.profileRank{text-align:left;display:flex;align-items:center;gap:8px}.profileRank span,.profileRank strong{display:inline;margin:0}.editionRow{grid-template-columns:44px 50px minmax(0,1fr)}.editionRow .miniScore{display:none}}

.overviewStats{margin-bottom:9px}
.rankTrendCard{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:13px;margin-bottom:14px;box-shadow:0 2px 10px rgba(23,42,31,.035);overflow:hidden}
.rankTrendHead{display:flex;justify-content:space-between;gap:12px;align-items:start;margin-bottom:8px}
.rankTrendHead strong{font-size:15px;color:var(--green)}
.rankTrendHead span{font-size:11px;color:var(--muted);text-align:right;line-height:1.35}
.rankTrendSvg{display:block;width:100%;height:auto;overflow:visible}
.rankTrendGrid{stroke:#e9e4d9;stroke-width:1}
.rankTrendLine{fill:none;stroke:var(--green2);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.rankTrendDot{fill:var(--card);stroke:var(--green2);stroke-width:2.5}
.rankTrendDot.best{fill:#f7edca;stroke:#b58d2b}
.rankTrendText{font-size:10px;fill:var(--muted);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
.rankTrendRank{font-size:10px;font-weight:800;fill:var(--green);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
.rankTrendChartScroll{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 -2px 5px;padding:0 2px}
.rankTrendSvg{max-width:none}
.rankTrendStrip{display:flex;gap:6px;overflow:auto;padding:3px 0 1px;scrollbar-width:none}
.rankTrendStrip::-webkit-scrollbar{display:none}
.rankTrendChip{flex:0 0 auto;border:1px solid var(--line);background:#faf8f2;border-radius:10px;padding:7px 9px;font-size:10px;color:var(--muted);white-space:nowrap}
.rankTrendChip b{color:var(--green);font-size:12px;margin-left:3px}
.editionToolbar.two{grid-template-columns:1fr 1fr}
.medal{font-size:18px;vertical-align:-1px;margin-right:3px}
@media(max-width:520px){.editionToolbar.two{grid-template-columns:1fr}.rankTrendCard{padding:11px}}

.statGroupTitle{font-size:11px;font-weight:820;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:12px 2px 7px}
.medalCabinet{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-bottom:12px}
.medalCard{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:11px 7px;text-align:center}
.medalCard b{display:block;font-size:22px;color:var(--green);font-variant-numeric:tabular-nums}
.medalCard span{display:block;margin-top:3px;font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.045em}
.resultYearGroup{margin-bottom:14px}
@media(max-width:370px){.medalCabinet{grid-template-columns:1fr}}

.rankingList{gap:5px}
.rankingList .row{padding:8px 10px;border-radius:12px}
.rankingCompactRow{display:grid;grid-template-columns:32px minmax(0,1fr);gap:8px;align-items:center}
.rankingCompactRow .rankNo{text-align:center}
.rankingCompactRow .name{font-size:14px}
.resultTrendCard{margin-bottom:14px}
.editionStandings{gap:5px}
.editionStandings .row{padding:8px 10px;border-radius:12px}
.matchStage{display:inline-block;font-size:9px;font-weight:850;text-transform:uppercase;letter-spacing:.045em;color:#9a7c35;background:#f7edca;border-radius:999px;padding:3px 6px;margin-top:4px}
@media(max-width:520px){.rankingList .row{padding:7px 9px}.rankingCompactRow{grid-template-columns:29px minmax(0,1fr);gap:6px}.rankingCompactRow .name{font-size:13.5px}.editionStandings{gap:4px}.editionStandings .row{padding:6px 8px}.editionStanding{grid-template-columns:42px minmax(0,1fr) auto;gap:6px}.editionStanding .editionPlace{min-width:42px;padding:5px 2px}.editionStanding .name{font-size:12.5px;line-height:1.18}.editionStanding .meta{font-size:9.5px;line-height:1.2;margin-top:2px}.editionStanding>.pill{padding:4px 6px;font-size:10px}}


.hallIntro{background:linear-gradient(145deg,var(--green),#0d2a1d);color:#fff;border-radius:18px;padding:15px;margin-bottom:12px;box-shadow:var(--shadow)}
.hallIntro .kicker{font-size:10px;font-weight:820;letter-spacing:.08em;text-transform:uppercase;color:#d8c692}
.hallIntro h2{font-size:22px;margin:5px 0 6px}
.hallIntro p{margin:0;color:#d7e2dc;font-size:12px;line-height:1.45}
.hallToolbar{margin-bottom:14px}
.hallToolbar select{width:100%;border:1px solid var(--line);background:#fff;border-radius:13px;padding:12px 13px;font-size:16px;color:var(--ink);outline:none}
.hallToolbar select:focus{border-color:#769680;box-shadow:0 0 0 3px rgba(36,86,62,.12)}
.hallGrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;margin-bottom:16px}
.hallCard{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;box-shadow:0 2px 10px rgba(23,42,31,.035);min-width:0}
.hallCard h3{font-size:14px;margin:0 0 8px;color:var(--green)}
.hallMiniList{display:grid;gap:7px}
.hallMiniRow{display:grid;grid-template-columns:23px minmax(0,1fr) auto;gap:7px;align-items:center;padding-top:7px;border-top:1px solid var(--line)}
.hallMiniRow:first-child{padding-top:0;border-top:0}
.hallPos{font-weight:850;color:#9a7c35;text-align:center;font-size:12px}
.hallName{font-size:12px;font-weight:760;line-height:1.25;overflow-wrap:anywhere}
.hallValue{font-size:12px;font-weight:850;color:var(--green);white-space:nowrap;font-variant-numeric:tabular-nums}
.hallDetail{font-size:10px;color:var(--muted);line-height:1.35;margin-top:2px}
.hallRow{display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:9px;align-items:center}
.hallRow .hallValue{font-size:13px}

<script>

const PRELIM_MATCHES=APP_DATA.matches;
const MATCHES=[...PRELIM_MATCHES,...FINAL_MATCHES];

const matchCountByPlayer=new Map();
const matchIndex=new Map();
MATCHES.forEach(match=>{
  [...new Set([...match.a,...match.b])].forEach(player=>{
    if(!matchIndex.has(player))matchIndex.set(player,[]);
    matchIndex.get(player).push(match);
    matchCountByPlayer.set(player,(matchCountByPlayer.get(player)||0)+1);
  });
});

const playerOptions=[...allPlayers].sort((a,b)=>{
  const rankA=rankingByName.get(a)?.rank??9999;
  const rankB=rankingByName.get(b)?.rank??9999;

});

// v19: runtime caches for static tournament data. The source data never changes
// during a session, so expensive aggregates can safely be reused between clicks.
const playerMatchesCache=new Map();
const playerSummaryCache=new Map();

const hallMatchStatsCache=new Map();

function validPlayer(value){
  const direct=playerOptions.find(name=>name===value);
  if(direct)return direct;
  const key=fold(value);
  if(!key)return '';
  const exact=playerOptions.find(name=>fold(name)===key);
  if(exact)return exact;
  return playerOptions.find(name=>(SEARCH_ALIASES[name]||[]).some(alias=>fold(alias)===key))||'';
}

function playerMatches(player){
  if(playerMatchesCache.has(player))return playerMatchesCache.get(player);
  const result=(matchIndex.get(player)||[]).map(match=>{
    const onA=match.a.includes(player);
    const mine=onA?match.a:match.b;
    const other=onA?match.b:match.a;
    const scoreFor=onA?match.sa:match.sb;
    const scoreAgainst=onA?match.sb:match.sa;
    const scoreKnown=Number.isFinite(scoreFor)&&Number.isFinite(scoreAgainst);
    const winnerSide=matchWinnerSide(match);
    const win=winnerSide?((onA&&winnerSide==='a')||(!onA&&winnerSide==='b')):(scoreKnown&&scoreFor>scoreAgainst);
    const loss=winnerSide?((onA&&winnerSide==='b')||(!onA&&winnerSide==='a')):(scoreKnown&&scoreFor<scoreAgainst);
    const draw=!win&&!loss&&scoreKnown&&scoreFor===scoreAgainst;
    return {...match,mine,other,scoreFor,scoreAgainst,scoreKnown,win,loss,draw};
  });
  playerMatchesCache.set(player,result);
  return result;
}

function rankingInfo(player){return rankingByName.get(player)||null}

function rankingDetails(player){
  const info=rankingInfo(player);
  if(!info)return null;
  const entries=Object.entries(info.placements).map(([year,rank])=>({year:Number(year),rank:Number(rank)})).sort((a,b)=>b.year-a.year);
  if(!entries.length)return {info,entries:[],best:null,years:[],titles:0,silvers:0,bronzes:0,podiums:0,average:null};
  const best=Math.min(...entries.map(item=>item.rank));
  const years=entries.filter(item=>item.rank===best).map(item=>item.year).sort((a,b)=>a-b);
  const titles=entries.filter(item=>item.rank===1).length;
  const silvers=entries.filter(item=>item.rank===2).length;
  const bronzes=entries.filter(item=>item.rank===3).length;
  const podiums=titles+silvers+bronzes;
  const average=entries.reduce((sum,item)=>sum+item.rank,0)/entries.length;
  return {info,entries,best,years,titles,silvers,bronzes,podiums,average};
}

function formatYears(years){
  if(!years?.length)return 'jaar niet gekend';
  if(years.length===1)return `in ${years[0]}`;
  if(years.length<=4)return `in ${years.slice(0,-1).join(', ')} en ${years[years.length-1]}`;
  return `${years.slice(0,3).join(', ')} … en ${years[years.length-1]} (${years.length}×)`;
}

function yearSpan(years){
  const values=[...years].sort((a,b)=>a-b);
  if(!values.length)return 'geen jaren';
  if(values.length<=4)return values.join(', ');
  return `${values[0]}–${values[values.length-1]} · ${values.length} edities`;
}

function opponentAggregate(matches){
  const map=new Map();
  matches.forEach(match=>match.other.forEach(name=>{
    if(!map.has(name))map.set(name,{name,n:0,w:0,l:0,d:0,pf:0,pa:0,years:new Set(),first:9999,last:0,matches:[]});
    const item=map.get(name);
    item.n+=1;item.w+=match.win?1:0;item.l+=match.loss?1:0;item.d+=match.draw?1:0;
    if(match.scoreKnown){item.pf+=match.scoreFor;item.pa+=match.scoreAgainst}item.years.add(match.year);
    item.first=Math.min(item.first,match.year);item.last=Math.max(item.last,match.year);item.matches.push(match);
  }));
  return [...map.values()].map(item=>({...item,diff:item.pf-item.pa,pct:item.n?item.w/item.n:0}));
}

function partnerAggregate(matches){
  const map=new Map();
  matches.forEach(match=>match.mine.filter(name=>name!==selectedPlayer).forEach(name=>{
    if(!map.has(name))map.set(name,{name,n:0,w:0,l:0,d:0,pf:0,pa:0,years:new Set(),first:9999,last:0,matches:[]});
    const item=map.get(name);
    item.n+=1;item.w+=match.win?1:0;item.l+=match.loss?1:0;item.d+=match.draw?1:0;
    if(match.scoreKnown){item.pf+=match.scoreFor;item.pa+=match.scoreAgainst}item.years.add(match.year);
    item.first=Math.min(item.first,match.year);item.last=Math.max(item.last,match.year);item.matches.push(match);
  }));
  return [...map.values()].map(item=>({...item,diff:item.pf-item.pa,pct:item.n?item.w/item.n:0}));
}

function pickFavorite(items){
  const pool=items.filter(item=>item.n>=3);
  if(!pool.length)return null;
  return [...pool].sort((a,b)=>b.pct-a.pct||b.n-a.n||b.w-a.w||b.diff-a.diff||a.name.localeCompare(b.name,'nl'))[0];
}

function pickAngstgegner(items){
  const pool=items.filter(item=>item.l-item.w>=2);
  if(!pool.length)return null;
  return [...pool].sort((a,b)=>(b.l-b.w)-(a.l-a.w)||a.pct-b.pct||b.n-a.n||b.l-a.l||a.diff-b.diff||a.name.localeCompare(b.name,'nl'))[0];
}

function pickRival(items){
  const pool=items.filter(item=>item.n>=5);
  if(!pool.length)return null;
  return [...pool].sort((a,b)=>Math.abs(a.pct-.5)-Math.abs(b.pct-.5)||b.n-a.n||Math.abs(a.diff)-Math.abs(b.diff)||b.last-a.last||a.name.localeCompare(b.name,'nl'))[0];
}

function pickMostPlayed(items){
  if(!items.length)return null;
  return [...items].sort((a,b)=>b.n-a.n||b.last-a.last||a.name.localeCompare(b.name,'nl'))[0];
}

function pickBestPartner(items){
  const pool=items.filter(item=>item.n>=3);
  if(!pool.length)return null;
  return [...pool].sort((a,b)=>b.pct-a.pct||b.n-a.n||b.w-a.w||b.diff-a.diff||a.name.localeCompare(b.name,'nl'))[0];
}

function calculateStreaks(matches){
  const ordered=[...matches].sort((a,b)=>a.year-b.year||a.order-b.order);
  let win=0,loss=0,bestWin=0,bestLoss=0;
  ordered.forEach(match=>{
    if(match.win){win+=1;loss=0}else if(match.loss){loss+=1;win=0}else{win=0;loss=0}
    bestWin=Math.max(bestWin,win);bestLoss=Math.max(bestLoss,loss);
  });
  return {win:bestWin,loss:bestLoss};
}

function buildYearStats(matches){
  const map=new Map();
  matches.forEach(match=>{
    if(!map.has(match.year))map.set(match.year,{year:match.year,n:0,w:0,l:0,d:0,pf:0,pa:0,partners:new Set(),matches:[]});
    const item=map.get(match.year);
    item.n+=1;item.w+=match.win?1:0;item.l+=match.loss?1:0;item.d+=match.draw?1:0;
    if(match.scoreKnown){item.pf+=match.scoreFor;item.pa+=match.scoreAgainst}item.matches.push(match);
    match.mine.filter(name=>name!==selectedPlayer).forEach(name=>item.partners.add(name));
  });
  return [...map.values()].map(item=>({...item,diff:item.pf-item.pa})).sort((a,b)=>b.year-a.year);
}

function playerSummary(player,matches){
  if(playerSummaryCache.has(player))return playerSummaryCache.get(player);
  const years=[...new Set(matches.map(match=>match.year))].sort((a,b)=>a-b);
  const wins=matches.filter(match=>match.win).length;
  const losses=matches.filter(match=>match.loss).length;
  const draws=matches.filter(match=>match.draw).length;
  const ranking=rankingDetails(player);
  const opponents=opponentAggregate(matches);
  const partners=partnerAggregate(matches);
  const favorite=pickFavorite(opponents);
  const nemesis=pickAngstgegner(opponents);
  const rival=pickRival(opponents);
  const mostPlayedOpponent=pickMostPlayed(opponents);
  const bestPartner=pickBestPartner(partners);
  const mostPlayedPartner=pickMostPlayed(partners);
  const biggestWin=[...matches].filter(match=>match.win&&match.scoreKnown).sort((a,b)=>(b.scoreFor-b.scoreAgainst)-(a.scoreFor-a.scoreAgainst)||b.year-a.year||b.order-a.order)[0]||null;
  const biggestLoss=[...matches].filter(match=>match.loss&&match.scoreKnown).sort((a,b)=>(b.scoreAgainst-b.scoreFor)-(a.scoreAgainst-a.scoreFor)||b.year-a.year||b.order-a.order)[0]||null;
  const clutchMatches=matches.filter(match=>match.scoreKnown&&!match.draw&&Math.min(match.scoreFor,match.scoreAgainst)>=90);
  const clutchWins=clutchMatches.filter(match=>match.win).length;
  const clutchLosses=clutchMatches.filter(match=>match.loss).length;
  const clutch={n:clutchMatches.length,w:clutchWins,l:clutchLosses,pct:clutchMatches.length?clutchWins/clutchMatches.length:0,matches:clutchMatches};
  const closestMatch=[...matches].filter(match=>match.scoreKnown&&!match.draw).sort((a,b)=>Math.abs(a.scoreFor-a.scoreAgainst)-Math.abs(b.scoreFor-b.scoreAgainst)||b.year-a.year||b.order-a.order)[0]||null;
  const streaks=calculateStreaks(matches);
  const yearStats=buildYearStats(matches);
  const bestWinEdition=[...yearStats].sort((a,b)=>b.w-a.w||b.diff-a.diff||b.year-a.year)[0]||null;
  const result={player,years,wins,losses,draws,ranking,opponents,partners,favorite,nemesis,rival,mostPlayedOpponent,bestPartner,mostPlayedPartner,biggestWin,biggestLoss,closestMatch,clutch,streaks,yearStats,bestWinEdition};
  playerSummaryCache.set(player,result);
  return result;
}

function latestParticipationYear(player){
  if(!player)return RANKINGS.asOf;
  const rankingPlayer=RANKINGS.players.find(item=>item.name===player);
  const placementYears=Object.keys(rankingPlayer?.placements||{}).map(Number).filter(Number.isFinite);
  if(placementYears.length)return Math.max(...placementYears);
  const matchYears=playerMatches(player).map(match=>Number(match.year)).filter(Number.isFinite);
  return matchYears.length?Math.max(...matchYears):RANKINGS.asOf;
}

function playedEdition(player,year){
  if(!player)return false;
  const rankingPlayer=RANKINGS.players.find(item=>item.name===player);
  if(rankingPlayer?.placements && rankingPlayer.placements[year]!=null)return true;
  return playerMatches(player).some(match=>Number(match.year)===Number(year));
}

function setupH2HCombo(opponents){
  const input=$('#h2hInput');const menu=$('#h2hMenu');let visible=[];let active=-1;let dirty=false;
  const close=()=>{menu.classList.remove('open');input.setAttribute('aria-expanded','false');active=-1;if(dirty){input.value=h2hOpponent;dirty=false}};
  const draw=(all=false)=>{
    const query=all||input.value===h2hOpponent?'':fold(input.value);
    visible=opponents.filter(item=>searchText(item.name).includes(query));
    menu.innerHTML=visible.length?visible.map((item,index)=>`<button type="button" class="comboOption${item.name===h2hOpponent?' active':''}" data-index="${index}"><span class="optionName">${esc(item.name)}</span><span class="optionMeta">${item.w}–${item.l} · ${item.n}×</span></button>`).join(''):'<div class="comboEmpty">Geen tegenstander gevonden</div>';
    menu.classList.add('open');input.setAttribute('aria-expanded','true');active=-1;
    $$('#h2hMenu [data-index]').forEach(button=>button.addEventListener('click',()=>choose(Number(button.dataset.index))));
  };
  const choose=index=>{const item=visible[index];if(!item)return;h2hOpponent=item.name;input.value=item.name;dirty=false;close();drawH2HBody()};
  const mark=()=>{$$('#h2hMenu .comboOption').forEach((button,index)=>button.classList.toggle('active',index===active));$$('#h2hMenu .comboOption')[active]?.scrollIntoView({block:'nearest'})};
  input.addEventListener('focus',()=>draw(true));input.addEventListener('input',()=>{dirty=true;draw(false)});
  input.addEventListener('keydown',event=>{if(event.key==='ArrowDown'){event.preventDefault();if(!menu.classList.contains('open'))draw(true);active=Math.min(active+1,visible.length-1);mark()}else if(event.key==='ArrowUp'){event.preventDefault();active=Math.max(active-1,0);mark()}else if(event.key==='Enter'){event.preventDefault();if(active>=0)choose(active);else if(visible.length)choose(0)}else if(event.key==='Escape')close()});
  $('#h2hToggle').addEventListener('click',event=>{event.stopPropagation();menu.classList.contains('open')?close():draw(true)});
  document.addEventListener('click',event=>{if(!event.target.closest('#h2hCombo'))close()});
}

function relationshipLabels(summary,name){
  const labels=[];
  if(summary.nemesis?.name===name)labels.push('Angstgegner');
  if(summary.rival?.name===name)labels.push('Aartsrivaal');
  if(summary.mostPlayedOpponent?.name===name)labels.push('Meest ontmoet');
  if(summary.favorite?.name===name)labels.push('Favoriete tegenstander');
  if(summary.bestPartner?.name===name)labels.push('Beste Partner');
  if(summary.mostPlayedPartner?.name===name)labels.push('Meest Vaste Partner');
  return labels;
}

const rankingSnapshotCache=new Map();
function rankingPoints(place,teams){
  if(place==null||!teams)return 0;
  return .5+((teams-Number(place)+.5)*20)/teams;
}
function rankingSnapshot(targetYear){
  if(rankingSnapshotCache.has(targetYear))return rankingSnapshotCache.get(targetYear);
  const years=RANKINGS.years;
  const targetIndex=years.indexOf(Number(targetYear));
  if(targetIndex<0)return new Map();
  const start=Math.max(0,targetIndex-9);
  const included=years.slice(start,targetIndex+1);
  const scores=RANKINGS.players.map(item=>{
    let score=0;
    included.forEach(year=>{
      const distance=targetIndex-years.indexOf(year);
      const weight=Math.max(0,1-distance/10);
      const place=item.placements?.[year];
      score+=rankingPoints(place,RANKINGS.teamCounts[year])*weight;
    });
    return {name:item.name,score,current:item.rank};
  }).filter(item=>item.score>0);
  scores.sort((a,b)=>b.score-a.score||a.current-b.current||a.name.localeCompare(b.name,'nl'));
  const result=new Map();
  scores.forEach((item,index)=>result.set(item.name,{rank:index+1,score:item.score}));
  rankingSnapshotCache.set(targetYear,result);
  return result;
}
function rankingEvolution(player){
  return RANKINGS.years.map(year=>{
    const item=rankingSnapshot(year).get(player);
    return item&&item.score>0?{year,rank:item.rank,score:item.score}:null;
  }).filter(Boolean);
}
function rankTrendHtml(player){

  const changes=history.slice(1).map((item,index)=>({year:item.year,delta:history[index].rank-item.rank}));
  const biggestRise=changes.length?[...changes].sort((a,b)=>b.delta-a.delta)[0]:null;
  const caption=`Beste positie ${ordinal(bestRank)}${biggestRise&&biggestRise.delta>0?` · grootste sprong +${biggestRise.delta} plaatsen in ${biggestRise.year}`:''}`;

function teamKey(players){return [...players].sort((a,b)=>a.localeCompare(b,'nl')).join('\u0001')}

function editionData(year){
  const yearKey=String(year);
  const prelimMatches=PRELIM_MATCHES.filter(match=>match.year===year).sort((a,b)=>a.order-b.order);
  const finalMatches=FINAL_MATCHES.filter(match=>match.year===year).sort((a,b)=>a.order-b.order);
  const groups=new Map();
  RANKINGS.players.forEach(item=>{
    const rank=item.placements?.[yearKey];
    if(rank==null)return;
    if(!groups.has(rank))groups.set(rank,[]);
    groups.get(rank).push(item.name);
  });
  const standings=[...groups.entries()].sort((a,b)=>Number(a[0])-Number(b[0])).map(([rank,names])=>{
    let players=[...names].sort((a,b)=>a.localeCompare(b,'nl'));
    const matchingSide=prelimMatches.flatMap(match=>[match.a,match.b]).find(side=>side.length===players.length&&players.every(name=>side.includes(name)));
    if(matchingSide)players=[...matchingSide];
    const key=teamKey(players);
    const aggregate={n:0,w:0,l:0,d:0,pf:0,pa:0};
    prelimMatches.forEach(match=>{
      let scoreFor=null,scoreAgainst=null;
      if(teamKey(match.a)===key){scoreFor=match.sa;scoreAgainst=match.sb}
      else if(teamKey(match.b)===key){scoreFor=match.sb;scoreAgainst=match.sa}
      if(scoreFor==null)return;
      aggregate.n+=1;aggregate.pf+=scoreFor;aggregate.pa+=scoreAgainst;
      if(scoreFor>scoreAgainst)aggregate.w+=1;else if(scoreFor<scoreAgainst)aggregate.l+=1;else aggregate.d+=1;
    });
    const stats=OFFICIAL_PRELIM_STATS[yearKey]?.[key]||aggregate;
    return {rank:Number(rank),players,...stats,diff:stats.pf-stats.pa};
  });
  return {year,standings,prelimMatches,finalMatches,matches:[...finalMatches,...prelimMatches]};
}

const hallPreRankCache=new Map();
function hallYears(){
  const years=[...RANKINGS.years];
  if(hallPeriod==='5')return years.slice(-5);
  if(hallPeriod==='10')return years.slice(-10);
  return years;
}
function hallPeriodLabel(years){
  if(!years.length)return 'geen edities';
  return `${years[0]}–${years[years.length-1]} · ${plural(years.length,'editie','edities')}`;
}
function hallPreEditionRanking(targetYear){
  const year=Number(targetYear);
  if(hallPreRankCache.has(year))return hallPreRankCache.get(year);
  const idx=RANKINGS.years.indexOf(year);
  if(idx<=0){const empty=new Map();hallPreRankCache.set(year,empty);return empty}
  const prior=RANKINGS.years.slice(Math.max(0,idx-10),idx);
  const scored=RANKINGS.players.map(item=>{
    let score=0;
    prior.forEach(priorYear=>{
      const distance=idx-RANKINGS.years.indexOf(priorYear);
      const weight=Math.max(0,1-distance/10);
      const place=item.placements?.[priorYear];
      score+=rankingPoints(place,RANKINGS.teamCounts[priorYear])*weight;
    });
    return {name:item.name,score,tie:item.rank};
  }).filter(item=>item.score>0).sort((a,b)=>b.score-a.score||a.tie-b.tie||a.name.localeCompare(b.name,'nl'));
  const result=new Map();scored.forEach((item,index)=>result.set(item.name,{rank:index+1,score:item.score}));
  hallPreRankCache.set(year,result);return result;
}
function hallPlacementStats(years){
  const cacheKey=yearCacheKey(years);
  if(hallPlacementStatsCache.has(cacheKey))return hallPlacementStatsCache.get(cacheKey);
  const allowed=new Set(years.map(String));
  const result=RANKINGS.players.map(item=>{
    const entries=Object.entries(item.placements||{}).filter(([year])=>allowed.has(year)).map(([year,rank])=>({year:Number(year),rank:Number(rank)}));
    const titles=entries.filter(x=>x.rank===1).length;
    const silvers=entries.filter(x=>x.rank===2).length;
    const bronzes=entries.filter(x=>x.rank===3).length;
    const podiums=titles+silvers+bronzes;
    const normalized=entries.map(x=>{
      const teams=RANKINGS.teamCounts[x.year]||0;
      return teams>1?100*(teams-x.rank)/(teams-1):100;
    });
    const avg=normalized.length?normalized.reduce((a,b)=>a+b,0)/normalized.length:null;
    const spread=normalized.length?Math.sqrt(normalized.reduce((sum,v)=>sum+(v-avg)**2,0)/normalized.length):null;
    return {name:item.name,titles,silvers,bronzes,podiums,participations:entries.length,avg,spread,entries};
  }).filter(item=>item.participations>0);
  hallPlacementStatsCache.set(cacheKey,result);
  return result;
}
function hallFinalLossStats(years,placements=hallPlacementStats(years)){
  const cacheKey=yearCacheKey(years);
  if(hallFinalLossStatsCache.has(cacheKey))return hallFinalLossStatsCache.get(cacheKey);
  const allowed=new Set(years);
  const byName=new Map(placements.map(item=>[item.name,{name:item.name,finalLosses:0,smallFinalLosses:0,bronzes:item.bronzes,participations:item.participations}]));
  const get=name=>{
    if(!byName.has(name))byName.set(name,{name,finalLosses:0,smallFinalLosses:0,bronzes:0,participations:0});
    return byName.get(name);
  };
  FINAL_MATCHES.filter(match=>allowed.has(match.year)&&(match.stage==='final'||match.stage==='small_final')).forEach(match=>{
    const winner=matchWinnerSide(match);
    if(!winner)return;
    const losers=winner==='a'?match.b:match.a;
    losers.forEach(name=>{
      const item=get(name);
      if(match.stage==='final')item.finalLosses++;
      else item.smallFinalLosses++;
    });
  });
  const result=[...byName.values()];
  hallFinalLossStatsCache.set(cacheKey,result);
  return result;
}

function hallMatchStats(years){
  const cacheKey=yearCacheKey(years);
  if(hallMatchStatsCache.has(cacheKey))return hallMatchStatsCache.get(cacheKey);
  const allowed=new Set(years);const playerMap=new Map();const rivalryMap=new Map();
  const matches=MATCHES.filter(match=>allowed.has(match.year));
  const getPlayer=name=>{if(!playerMap.has(name))playerMap.set(name,{name,n:0,w:0,l:0,d:0,clutchN:0,clutchW:0,clutchL:0,sympathyL:0,photoFinishW:0,steamrollW:0,beulW:0,marieL:0});return playerMap.get(name)};
  matches.forEach(match=>{
    const winner=matchWinnerSide(match),aWin=winner==='a',bWin=winner==='b',draw=!winner&&hasKnownScore(match)&&match.sa===match.sb;
    const scoredWin=hasKnownScore(match)&&Boolean(winner);
    const winnerScore=scoredWin?(aWin?match.sa:match.sb):null;
    const loserScore=scoredWin?(aWin?match.sb:match.sa):null;
    const margin=scoredWin?winnerScore-loserScore:null;
    const clutch=scoredWin&&loserScore>=90;
    const sympathyLoss=scoredWin&&loserScore>=95;
    const photoFinish=clutch&&margin<=5;
    const steamroll=scoredWin&&loserScore<20;
    const beul=scoredWin&&loserScore===0;
    const marie=scoredWin&&winnerScore===101&&loserScore===0;
    match.a.forEach(name=>{const p=getPlayer(name);p.n++;p.w+=aWin?1:0;p.l+=bWin?1:0;p.d+=draw?1:0;if(clutch){p.clutchN++;p.clutchW+=aWin?1:0;p.clutchL+=bWin?1:0}if(sympathyLoss&&bWin)p.sympathyL++;if(photoFinish&&aWin)p.photoFinishW++;if(steamroll&&aWin)p.steamrollW++;if(beul&&aWin)p.beulW++;if(marie&&bWin)p.marieL++});
    match.b.forEach(name=>{const p=getPlayer(name);p.n++;p.w+=bWin?1:0;p.l+=aWin?1:0;p.d+=draw?1:0;if(clutch){p.clutchN++;p.clutchW+=bWin?1:0;p.clutchL+=aWin?1:0}if(sympathyLoss&&aWin)p.sympathyL++;if(photoFinish&&bWin)p.photoFinishW++;if(steamroll&&bWin)p.steamrollW++;if(beul&&bWin)p.beulW++;if(marie&&aWin)p.marieL++});
    match.a.forEach(a=>match.b.forEach(b=>{
      const names=[a,b].sort((x,y)=>x.localeCompare(y,'nl'));const key=names.join('\u0001');
      if(!rivalryMap.has(key))rivalryMap.set(key,{a:names[0],b:names[1],n:0,wa:0,wb:0,d:0,years:new Set()});
      const r=rivalryMap.get(key);r.n++;r.years.add(match.year);
      if(!aWin&&!bWin)r.d++;
      else{const winningSide=aWin?match.a:match.b;if(winningSide.includes(r.a))r.wa++;else r.wb++}
    }));
  });
  const result={matches,players:[...playerMap.values()],rivalries:[...rivalryMap.values()]};
  hallMatchStatsCache.set(cacheKey,result);
  return result;
}

function hallUpsets(matches){
  return matches.map(match=>{
    if(match.sa===match.sb)return null;
    const winner=match.sa>match.sb?match.a:match.b,loser=match.sa>match.sb?match.b:match.a;
    const winnerScore=match.sa>match.sb?match.sa:match.sb,loserScore=match.sa>match.sb?match.sb:match.sa;
    const snap=hallPreEditionRanking(match.year);
    const wr=winner.map(name=>snap.get(name)?.rank).filter(Number.isFinite);
    const lr=loser.map(name=>snap.get(name)?.rank).filter(Number.isFinite);
    if(wr.length!==winner.length||lr.length!==loser.length)return null;
    const winnerRank=wr.reduce((a,b)=>a+b,0)/wr.length,loserRank=lr.reduce((a,b)=>a+b,0)/lr.length;
    const gap=winnerRank-loserRank;
    return gap>0?{year:match.year,winner,loser,winnerScore,loserScore,winnerRank,loserRank,gap}:null;
  }).filter(Boolean).sort((a,b)=>b.gap-a.gap||b.year-a.year).slice(0,10);
}

function hallGiantKillers(years){
  const cacheKey=yearCacheKey(years);
  if(hallGiantKillersCache.has(cacheKey))return hallGiantKillersCache.get(cacheKey);
  const allowed=new Set(years);
  const counts=new Map();
  MATCHES.filter(match=>allowed.has(match.year)).forEach(match=>{
    const champion=editionData(match.year).standings.find(team=>team.rank===1);
    if(!champion)return;
    const winner=matchWinnerSide(match);
    if(!winner)return;
    const losingTeam=winner==='a'?match.b:match.a;
    if(teamKey(losingTeam)!==teamKey(champion.players))return;
    const winningTeam=winner==='a'?match.a:match.b;
    winningTeam.forEach(name=>counts.set(name,(counts.get(name)||0)+1));
  });
  const result=[...counts].map(([name,giantKills])=>({name,giantKills})).sort((a,b)=>b.giantKills-a.giantKills||a.name.localeCompare(b.name,'nl'));
  hallGiantKillersCache.set(cacheKey,result);
  return result;
}
function hallImprovementStreak2025(){
  return RANKINGS.players.filter(item=>item.placements?.[2025]!=null).map(item=>{
    const entries=Object.entries(item.placements||{}).map(([year,rank])=>({year:Number(year),rank:Number(rank)})).sort((a,b)=>a.year-b.year);
    const end=entries.findIndex(entry=>entry.year===2025);
    if(end<0)return null;
    let start=end,improvements=0;
    for(let i=end;i>0;i--){
      if(entries[i].rank<entries[i-1].rank){start=i-1;improvements++}else break;
    }
    const sequence=entries.slice(start,end+1);
    return {name:item.name,improvements,sequence,startYear:sequence[0]?.year,endYear:2025};
  }).filter(item=>item&&item.improvements>0).sort((a,b)=>b.improvements-a.improvements||a.name.localeCompare(b.name,'nl'));
}
function compactPlacementSequence(sequence){
  return sequence.map(entry=>`${entry.year}: ${entry.rank}e`).join(' → ');
}

      ${hallMiniLeaderboard('De Laatbloeier',patient,x=>`${x.titleAt}e deelname`,x=>`eerste titel in ${x.titleYear}`,5)}
      ${hallMiniLeaderboard('De Pletwals',steamroll,x=>`${x.steamrollW}×`,x=>'zeges met minder dan 20 verliespunten',5)}
      ${hallMiniLeaderboard('De Beul',beul,x=>`${x.beulW}×`,x=>'tegenstander op 0 punten gehouden',5)}
      ${hallMiniLeaderboard('Het Kapblok',marie,x=>`${x.marieL}×`,x=>'0–101 verliesbomen',5)}
    </div>
    <div class="infoNote"><strong>De Reuzendoder:</strong> meeste bomen gewonnen tegen het duo dat die editie uiteindelijk officieel kampioen werd. <strong>De Zilveren Vos:</strong> meeste officiële tweede plaatsen. <strong>De Houten Medaille:</strong> meeste effectief verloren kleine finales; bij een gelijke stand krijgt de speler met de minste officiële bronzen plaatsen voorrang. <strong>De Poulidor:</strong> nooit kampioen en minstens 2 keer tweede; eerst gerangschikt op aantal zilveren plaatsen en daarna op brons. <strong>De Trouwe Soldaat:</strong> meeste deelnames. <strong>De Houthakker:</strong> meeste gewonnen bomen. <strong>De Sympathiekste:</strong> meeste verliesbomen waarbij de eigen ploeg toch minstens 95 punten behaalde. <strong>De Ontsnappingskoning:</strong> meeste gewonnen nagelbijters met maximaal 5 punten verschil. <strong>De Laatbloeier:</strong> hoogste deelnamenummer waarop iemand voor het eerst kampioen werd. <strong>De Pletwals:</strong> meeste zeges waarbij de verliezende ploeg minder dan 20 punten behaalde. <strong>De Beul:</strong> meeste zeges waarbij de tegenstander op 0 bleef. <strong>Het Kapblok:</strong> meeste exacte 0–101 nederlagen.</div>

    <div class="sectionTitle"><h2>De Grootste rivaliteiten</h2><span>minstens 5 duels · exact 50/50</span></div>
    ${tableRows(rivalries.slice(0,5),item=>`<div><div class="hallPair">${hallPlayerName(item.a)} ↔ ${hallPlayerName(item.b)}</div><div class="hallDetail">${item.wa}–${item.wb} · ${item.n} duels · ${Math.min(...item.years)}–${Math.max(...item.years)}</div></div><span class="hallBadge">50/50</span>`)}<div class="infoNote"><strong>De Grootste rivaliteiten:</strong> alleen duo's met minstens 5 onderlinge duels én exact evenveel zeges worden opgenomen. De vijf rivaliteiten met de meeste duels staan bovenaan.</div></div> `;
  $('#hallPeriod').addEventListener('change',event=>{hallPeriod=event.target.value;medalStandExpanded=false;renderHallOfFame()});
  $('#medalFullToggle').addEventListener('change',event=>{medalStandExpanded=event.target.checked;renderHallOfFame()});
}

function renderRanking(summary){
  const rank=summary?.ranking||null;
  const rankingYears=[...RANKINGS.years];
  const yearHeader=rankingYears.map(year=>`<span>${year===1992?'’92':`’${String(year).slice(-2)}`}</span>`).join('');
  $('#content').innerHTML=`
    <div class="sectionTitle"><h2>Ranking</h2><span>meerjarige stand t.e.m. ${RANKINGS.asOf}</span></div>
    ${selectedPlayer?(rank?.info?rankTrendHtml(selectedPlayer):'<div class="empty">Deze speler staat niet in de beschikbare ranking.</div>'):''}
    <div class="sectionTitle"><h2>Klassement</h2><span>${RANKINGS.players.length} spelers</span></div>
    <div class="controlRow"><div class="search"><input id="rankingSearch" type="search" placeholder="Zoek in de ranking…" autocomplete="off"></div><div class="viewToggle"><label><input type="checkbox" id="rankingFullToggle"${rankingExpanded?' checked':''}> Volledige ranking</label></div></div>
    <div class="rankingFreezeShell">
      <div class="rankingFrozen">
        <div class="rankingFrozenHead"><span>#</span><span>Speler</span></div>
        <div id="rankingFrozenRows"></div>
      </div>
      <div class="rankingYearsScroll" id="rankingYearsScroll">
        <div class="rankingYearsHead"><div class="recentRanks">${yearHeader}</div></div>
        <div id="rankingYearRows"></div>
      </div>
    </div>
    <div class="infoNote"><strong>Meerjarige ranking.</strong> De grafiek toont de positie na elke editie, berekend zoals in Excel: maximaal 10 gespeelde edities, met de recentste op 100%, de vorige op 90% en zo verder tot 10%. Rechts staan de officiële eindplaatsen per editie vanaf 1992. Een goud gemarkeerd jaarvak betekent dat die speler na die editie op nummer 1 stond in de meerjarige rankall; dit staat los van de uitslag van die editie.</div>`;

  const yearsHtmlFor=item=>rankingYears.map(year=>{
    const place=item.placements?.[year];
    const display=place==null?'–':(medalForRank(Number(place))||place);
    const snap=rankingSnapshot(year).get(item.name);
    const rankallLeader=snap?.rank===1;
    return `<span class="${rankallLeader?'rankLeaderYear':''}" title="${rankallLeader?`#1 in meerjarige ranking na ${year}`:`Uitslag ${year}`}">${display}</span>`;
  }).join('');
  const frozenRowHtml=item=>`<div class="rankingFrozenRow${item.name===selectedPlayer?' selected':''}" data-ranking-name="${esc(item.name)}"><div class="rankNo">${item.rank}</div><div class="name">${esc(item.name)}</div></div>`;
  const yearRowHtml=item=>`<div class="rankingYearsRow${item.name===selectedPlayer?' selected':''}" data-ranking-name="${esc(item.name)}"><div class="recentRanks">${yearsHtmlFor(item)}</div></div>`;
  const compactItems=()=>{
    const top=RANKINGS.players.slice(0,10);
    if(!selectedPlayer)return [{type:'rows',items:top}];
    const idx=RANKINGS.players.findIndex(item=>item.name===selectedPlayer);
    if(idx<0||idx<10)return [{type:'rows',items:top}];
    const lo=Math.max(10,idx-2),hi=Math.min(RANKINGS.players.length,idx+3);
    const context=RANKINGS.players.slice(lo,hi);
    const blocks=[{type:'rows',items:top}];
    if(lo>10)blocks.push({type:'ellipsis'});
    blocks.push({type:'rows',items:context});
    return blocks;
  };
  const bindRows=()=>{
    $$('[data-ranking-name]').forEach(row=>row.addEventListener('click',()=>setPlayer(row.dataset.rankingName,{scroll:true})));
  };
  const draw=()=>{
    const query=fold($('#rankingSearch').value);
    let blocks;
    if(query){
      const filtered=RANKINGS.players.filter(item=>searchText(item.name).includes(query));
      blocks=filtered.length?[{type:'rows',items:filtered}]:[];
    }else if(rankingExpanded){
      blocks=[{type:'rows',items:RANKINGS.players}];
    }else{
      blocks=compactItems();
    }
    if(!blocks.length){
      $('#rankingFrozenRows').innerHTML='<div class="rankingFreezeEllipsis">–</div>';
      $('#rankingYearRows').innerHTML='<div class="rankingFreezeEllipsis" style="min-width:820px">Geen speler gevonden.</div>';
    }else{
      $('#rankingFrozenRows').innerHTML=blocks.map(block=>block.type==='ellipsis'?'<div class="rankingFreezeEllipsis">•••</div>':block.items.map(frozenRowHtml).join('')).join('');
      $('#rankingYearRows').innerHTML=blocks.map(block=>block.type==='ellipsis'?'<div class="rankingFreezeEllipsis" style="min-width:820px">•••</div>':block.items.map(yearRowHtml).join('')).join('');
    }
    bindRows();
  };
  $('#rankingSearch').addEventListener('input',draw);
  $('#rankingFullToggle').addEventListener('change',event=>{rankingExpanded=event.target.checked;draw()});
  draw();
  requestAnimationFrame(()=>{
    const tableScroller=$('#rankingYearsScroll');
    if(tableScroller)tableScroller.scrollLeft=tableScroller.scrollWidth-tableScroller.clientWidth;
    const chartScroller=$('.rankTrendChartScroll');
    if(chartScroller)chartScroller.scrollLeft=chartScroller.scrollWidth-chartScroller.clientWidth;
  });
}

const mainInput=$('#playerInput');const mainMenu=$('#playerMenu');let visibleMainOptions=[];let activeMainIndex=-1;
function closeMainMenu({restore=true}={}){mainMenu.classList.remove('open');mainInput.setAttribute('aria-expanded','false');activeMainIndex=-1;if(restore&&mainInputDirty){mainInput.value=selectedPlayer;$('#mainCombo').classList.toggle('hasValue',Boolean(selectedPlayer));mainInputDirty=false}}
function chooseMainOption(index){const player=visibleMainOptions[index];if(player)setPlayer(player)}
function drawMainOptions(showAll=false){
  const query=showAll||mainInput.value===selectedPlayer?'':fold(mainInput.value);
  visibleMainOptions=playerOptions.filter(name=>searchText(name).includes(query));
  mainMenu.innerHTML=visibleMainOptions.length?visibleMainOptions.map((name,index)=>{const rank=rankingByName.get(name)?.rank;const pieces=[];if(rank)pieces.push(`ranking ${ordinal(rank)}`);pieces.push(`${matchCountByPlayer.get(name)||0} wedstr.`);return `<button type="button" class="comboOption${name===selectedPlayer?' active':''}" data-index="${index}" role="option"><span class="optionName">${esc(name)}</span><span class="optionMeta">${esc(pieces.join(' · '))}</span></button>`}).join(''):'<div class="comboEmpty">Geen speler gevonden</div>';
  mainMenu.classList.add('open');mainInput.setAttribute('aria-expanded','true');activeMainIndex=-1;
  $$('#playerMenu [data-index]').forEach(button=>button.addEventListener('click',()=>chooseMainOption(Number(button.dataset.index))));
}
function markMainOption(){$$('#playerMenu .comboOption').forEach((button,index)=>button.classList.toggle('active',index===activeMainIndex));$$('#playerMenu .comboOption')[activeMainIndex]?.scrollIntoView({block:'nearest'})}
mainInput.addEventListener('focus',()=>drawMainOptions(true));
mainInput.addEventListener('input',()=>{mainInputDirty=mainInput.value!==selectedPlayer;$('#mainCombo').classList.toggle('hasValue',Boolean(mainInput.value));drawMainOptions(false)});
mainInput.addEventListener('keydown',event=>{if(event.key==='ArrowDown'){event.preventDefault();if(!mainMenu.classList.contains('open'))drawMainOptions(true);activeMainIndex=Math.min(activeMainIndex+1,visibleMainOptions.length-1);markMainOption()}else if(event.key==='ArrowUp'){event.preventDefault();activeMainIndex=Math.max(activeMainIndex-1,0);markMainOption()}else if(event.key==='Enter'){event.preventDefault();if(activeMainIndex>=0)chooseMainOption(activeMainIndex);else{const exact=validPlayer(mainInput.value);if(exact)setPlayer(exact);else if(visibleMainOptions.length===1)setPlayer(visibleMainOptions[0])}}else if(event.key==='Escape')closeMainMenu()});
$('#playerToggle').addEventListener('click',event=>{event.stopPropagation();mainMenu.classList.contains('open')?closeMainMenu():drawMainOptions(true)});
$('#playerClear').addEventListener('click',event=>{event.stopPropagation();clearPlayer()});
document.addEventListener('click',event=>{if(!event.target.closest('#mainCombo'))closeMainMenu()});

$$('.tab').forEach(button=>button.addEventListener('click',()=>setTab(button.dataset.tab)));
if(!$$('.tab').some(button=>button.dataset.tab===activeTab))activeTab='overview';
const queryPlayer=new URLSearchParams(location.search).get('speler');
const savedPlayer=safeStore.get('manillenPlayer');
const initialPlayer=validPlayer(queryPlayer)||validPlayer(savedPlayer);
if(initialPlayer)setPlayer(initialPlayer);else render();
</script>
